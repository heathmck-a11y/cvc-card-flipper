<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVC Card Flipper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400&text=y&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Teachers:wght@500&family=Urbanist:wght@500&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400&family=Patrick+Hand&family=Quicksand:wght@500&family=Schoolbell&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141a3c;
    --sheet: #fbf6ec;
    --card-edge: #8fa0ee;
    --ink: #1f2a44;
    --muted: #6b7280;
    --card: #ffffff;
    --edge: #d9cfbd;
    --vowel: #c8372d;
    --vowel-bg: #fff4e0;
    --accent: #ffd23f;
    --accent-ink: #1f2a44;
    --chip-on: #2f4f9e;
    --chip-on-vowel: #c8372d;
    --letters: Teachers, "Century Gothic", Andika, system-ui, sans-serif;
    --letters-w: 500;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--bg); color: var(--ink);
    background-image:
      radial-gradient(circle at 12% 18%, #fff 0 1.5px, transparent 2px),
      radial-gradient(circle at 78% 12%, #fff 0 2px, transparent 2.5px),
      radial-gradient(circle at 34% 62%, #cfd8ff 0 1.5px, transparent 2px),
      radial-gradient(circle at 91% 55%, #fff 0 1.5px, transparent 2px),
      radial-gradient(circle at 58% 34%, #ffe9a8 0 2px, transparent 2.5px),
      radial-gradient(circle at 22% 88%, #fff 0 2px, transparent 2.5px),
      radial-gradient(circle at 67% 82%, #cfd8ff 0 1.5px, transparent 2px),
      radial-gradient(circle at 46% 8%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 5% 48%, #ffe9a8 0 1.5px, transparent 2px),
      radial-gradient(circle at 110% 105%, #6b4fd8 0 16vmin, transparent 16.2vmin),
      radial-gradient(circle at -6% -8%, #2b8f8a 0 12vmin, transparent 12.2vmin),
      linear-gradient(180deg, #141a3c, #2a1f5c);
    background-attachment: fixed;
    font-family: "Lexend", Andika, "Century Gothic", "Comic Sans MS", system-ui, sans-serif;
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; gap: 12px;
  }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
  h1 svg { width: 42px; height: 42px; flex: none; }
  button { font: inherit; cursor: pointer; }
  .btn {
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 1rem;
    min-height: 46px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.big { font-size: 1.5rem; padding: 16px 44px; min-height: 64px; box-shadow: 0 5px 0 #c79a12; }
  .btn.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #c79a12; }
  .controls.row2 { gap: 12px; }
  .controls.stack .link.faint { flex-basis: auto; margin-top: 2px; }
  .controls.stack { flex-direction: column; align-items: center; gap: 12px; }
  .btn:focus-visible, .card:focus-visible, .chip:focus-visible { outline: 3px solid #f2a900; outline-offset: 3px; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 16px 20px; gap: 3vh; min-height: 0;
  }
  .row { display: flex; gap: clamp(8px, 2.5vw, 28px); justify-content: center; width: 100%; perspective: 1400px; }
  .card {
    width: min(29vw, 42vh); aspect-ratio: 3 / 4;
    background: var(--card); color: var(--ink); font-family: var(--letters);
    border: 3px solid var(--card-edge); border-radius: clamp(12px, 2.4vw, 28px);
    box-shadow: 0 6px 0 var(--card-edge), 0 0 34px rgba(143, 160, 238, .45);
    font-size: min(22vw, 32vh); line-height: 1; font-weight: var(--letters-w, 400);
    display: flex; align-items: center; justify-content: center;
    padding: 0 0 .12em; position: relative;
    transition: transform .16s ease-in;
    user-select: none; -webkit-user-select: none;
  }
  .card.vowel { background: var(--card); color: var(--ink); }
  .card.showing-pic { background: #fff; }
  .card.back {
    background-color: #2a2f7a; border-color: #ffd23f; box-shadow: 0 6px 0 #c79a12, 0 0 34px rgba(255, 210, 63, .4);
    background-image:
      radial-gradient(circle at 20% 22%, #fff 0 2px, transparent 3px), radial-gradient(circle at 78% 30%, #cfd8ff 0 2px, transparent 3px),
      radial-gradient(circle at 30% 80%, #fff 0 2px, transparent 3px), radial-gradient(circle at 72% 74%, #ffe9a8 0 2px, transparent 3px);
  }
  .card.back::after { content: "\2605"; color: #ffd23f; font-size: .6em; font-family: system-ui, sans-serif; }
  .card .pic { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: auto; height: auto; max-width: 90%; max-height: 90%; pointer-events: none; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  /* Picture clue controls are kept faint on purpose so they don't pull students' eyes. */
  .clue { width: 44px; height: 30px; background: none; border: none; padding: 0; display: flex; align-items: center; justify-content: center; }
  .clue::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .22); }
  .clue[aria-pressed="true"]::before { background: rgba(255, 210, 63, .75); }
  .link.faint { flex-basis: 100%; text-decoration: none; font-size: .8rem; opacity: .4; padding: 4px; }
  .clue:disabled { opacity: .35; }
  .card.turning { transform: rotateX(90deg); }
  .card.nope { animation: nope .3s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .card .hint {
    position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
    font-size: clamp(10px, 1.4vw, 14px); color: var(--muted); letter-spacing: .04em;
  }
  .arrow { width: min(92vw, 138vh); height: 40px; display: flex; align-items: center; padding-left: 5%; }
  .arrow .trail { flex: 1; height: 0; border-top: 5px dotted #ffd23f; opacity: .9; }
  .arrow svg { width: 64px; height: 40px; flex: none; display: block; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* settings */
  .scrim {
    position: fixed; inset: 0; background: rgba(31, 42, 68, .45);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .scrim.open { display: flex; }
  .sheet {
    background: var(--sheet); width: min(760px, 100%); max-height: 94vh; overflow: auto;
    border-radius: 22px 22px 0 0; padding: 18px 18px 24px;
    font-family: system-ui, sans-serif;
  }
  @media (min-height: 700px) and (min-width: 800px) {
    .scrim { align-items: center; } .sheet { border-radius: 22px; }
  }
  .sheet h2 { margin: 0; font-size: 1.2rem; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .sheet p { margin: 4px 0 10px; color: var(--muted); font-size: .92rem; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .small {
    border: 1.5px solid var(--edge); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 7px 14px; font-size: .9rem; min-height: 38px;
  }
  .sec { margin-top: 16px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sec-head h3 { margin: 0; font-size: 1rem; }
  .sec-head span { color: var(--muted); font-size: .85rem; }
  .sec-tools { display: flex; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .chip {
    width: 46px; height: 46px; border-radius: 12px;
    border: 2px solid var(--edge); background: #fff; color: var(--muted);
    font-family: var(--letters); font-size: 1.4rem; line-height: 1;
    padding: 0 0 3px;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }
  .chips.v .chip[aria-pressed="true"] { background: var(--chip-on-vowel); border-color: var(--chip-on-vowel); }
  .fonts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .fontpick { border: 2px solid var(--edge); background: #fff; color: var(--ink); border-radius: 12px; padding: 6px 12px 8px; text-align: center; min-width: 104px; }
  .fontpick b { display: block; font-weight: 400; font-size: 1.7rem; line-height: 1.25; }
  .fontpick span { display: block; font-family: system-ui, sans-serif; font-size: .75rem; color: var(--muted); }
  .fontpick[aria-pressed="true"] { border-color: #2f4f9e; box-shadow: 0 0 0 2px #2f4f9e; }
  .check { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: .95rem; }
  .check input { width: 22px; height: 22px; }
  .hud { color: #fff; text-align: center; font-family: system-ui, sans-serif; }
  .hud .who { font-size: 1.05rem; font-weight: 700; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #8fa0ee; background: transparent; }
  .dot.yes { background: #5fd36a; border-color: #5fd36a; }
  .dot.no { background: #ff7a6b; border-color: #ff7a6b; }
  .dot.now { border-color: #ffd23f; box-shadow: 0 0 0 3px rgba(255, 210, 63, .35); }
  .mark { border: none; border-radius: 18px; padding: 14px 26px; font-weight: 700; font-size: 1.15rem; min-height: 60px; min-width: 150px; color: #10231a; }
  .mark.yes { background: #5fd36a; }
  .mark.no { background: #ff9d8f; }
  .mark:disabled { opacity: .5; }
  .link { background: none; border: none; color: #cfd8ff; text-decoration: underline; font-size: .95rem; padding: 10px; font-family: system-ui, sans-serif; }
  .sheet .big { font-family: Andika, sans-serif; font-size: 3.2rem; font-weight: 700; text-align: center; margin: 10px 0 0; color: var(--ink); }
  .sheet .center { text-align: center; }
  .opt { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; padding: 6px 16px 6px 2px; min-height: 42px; font: inherit; font-size: 1rem; color: var(--ink); cursor: pointer; text-align: left; }
  .opt::before { content: ""; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #8a93a8; background: #fff; }
  .opt[aria-pressed="true"] { font-weight: 700; }
  .opt[aria-pressed="true"]::before { border-color: var(--chip-on); background: radial-gradient(circle, var(--chip-on) 0 44%, #fff 48%); }
  .opt:focus-visible { outline: 3px solid #9db4f0; outline-offset: 2px; border-radius: 8px; }
  .pick.col { flex-direction: column; align-items: flex-start; gap: 0; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .pick .small[aria-pressed="true"] { background: #2f4f9e; border-color: #2f4f9e; color: #fff; }
  .addrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
  .addrow input { flex: 1; min-width: 140px; font: inherit; padding: 9px 12px; border: 1.5px solid var(--edge); border-radius: 12px; background: #fff; color: var(--ink); }
  .day { background: #fff; border: 1.5px solid var(--edge); border-radius: 14px; padding: 10px 14px; margin-top: 8px; }
  .day h4 { margin: 0 0 4px; font-size: .95rem; }
  .game { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .game b { font-size: 1.1rem; }
  .sheet .foot { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .sheet .btn { border-color: #2f4f9e; color: #2f4f9e; }
  .sheet .btn.primary { background: #2f4f9e; color: #fff; }
  .sheet .btn:disabled { opacity: .45; }
  .nopics .clue, .nopics #allClues { display: none; }
  #qrBox { position: fixed; left: 10px; bottom: 10px; width: 54px; height: 54px; padding: 4px; background: #fff; border: none; border-radius: 8px; opacity: .85; z-index: 5; }
  #qrBox svg, #qrBig svg { width: 100%; height: 100%; display: block; }
  #qrBig { width: min(70vw, 60vh); height: min(70vw, 60vh); background: #fff; padding: 14px; border-radius: 16px; margin: 0 auto; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card.nope { animation: none; } }
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 48 48" aria-hidden="true">
    <line x1="16" y1="12" x2="12" y2="4" stroke="#7be36b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="12" x2="36" y2="4" stroke="#7be36b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="12" cy="4" r="3" fill="#ffd23f"/><circle cx="36" cy="4" r="3" fill="#ffd23f"/>
    <ellipse cx="24" cy="27" rx="18" ry="16" fill="#7be36b"/>
    <circle cx="17" cy="24" r="6" fill="#fff"/><circle cx="31" cy="24" r="6" fill="#fff"/>
    <circle cx="18" cy="25" r="2.6" fill="#1f2a44"/><circle cx="30" cy="25" r="2.6" fill="#1f2a44"/>
    <path d="M17 35 Q24 40 31 35" fill="none" stroke="#1f2a44" stroke-width="2.2" stroke-linecap="round"/>
  </svg>CVC Card Flipper</h1>
  <button class="btn" id="openSet">Choose letters</button>
</header>

<main>
  <div class="hud" id="hud" hidden>
    <div class="who" id="hudWho"></div>
    <div class="who" id="hudScores" style="font-weight:400;font-size:.95rem;margin-top:6px"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="row" id="row">
    <div class="col"><button class="card" data-pos="0" aria-label="First letter. Tap to flip."><span class="ltr"></span><img class="pic" alt="" hidden></button><button class="clue" data-clue="0" aria-pressed="false" aria-label="Picture clue" title="Picture clue"></button></div>
    <div class="col"><button class="card vowel" data-pos="1" aria-label="Middle letter. Tap to flip."><span class="ltr"></span><img class="pic" alt="" hidden></button><button class="clue" data-clue="1" aria-pressed="false" aria-label="Picture clue" title="Picture clue"></button></div>
    <div class="col"><button class="card" data-pos="2" aria-label="Last letter. Tap to flip."><span class="ltr"></span><img class="pic" alt="" hidden></button><button class="clue" data-clue="2" aria-pressed="false" aria-label="Picture clue" title="Picture clue"></button></div>
  </div>
  <div class="arrow" id="arrow" aria-hidden="true">
    <div class="trail"></div>
    <svg viewBox="0 0 64 40">
      <path d="M2 20 L14 13 L14 27 Z" fill="#ff8a3d"/>
      <path d="M12 10 L40 10 Q58 12 62 20 Q58 28 40 30 L12 30 Z" fill="#f4f6ff" stroke="#8fa0ee" stroke-width="2"/>
      <path d="M46 11 Q58 13 62 20 Q58 27 46 29 Z" fill="#ff5d5d"/>
      <circle cx="34" cy="20" r="5" fill="#6fd3ff" stroke="#1f2a44" stroke-width="2"/>
      <path d="M12 10 L6 3 L22 10 Z M12 30 L6 37 L22 30 Z" fill="#ff5d5d"/>
    </svg>
  </div>
  <div class="controls stack" id="freeControls">
    <button class="btn primary big" id="playBtn">Play 10 flips</button>
    <div class="controls row2">
      <button class="btn" id="newWord">New word (practice)</button>
      <button class="btn" id="scoresBtn">Scores</button>
    </div>
    <button class="link faint" id="allClues" aria-pressed="false">Show picture clues</button>
  </div>
  <div id="gameControls" hidden>
    <div class="controls">
      <button class="mark yes" id="markYes">Read it</button>
      <button class="mark no" id="markNo">Not yet</button>
    </div>
    <div class="controls"><button class="link" id="stopGame">Stop this game (score is not saved)</button></div>
  </div>
</main>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-top">
      <h2 id="setTitle">Choose letters</h2>
      <button class="btn primary" id="closeSet">Done</button>
    </div>
    <div class="sec" id="whoSec">
      <div class="sec-head"><h3>Sounds for</h3></div>
      <div class="pick" id="whoSounds"></div>
      <p id="whoNote" style="margin:0 0 6px;font-size:.85rem"></p>
    </div>
    <p>Tap letters to turn them on or off for each card. Each card needs at least one letter.</p>
    <div class="quick">
      <button class="small" data-preset="standard">Standard CVC</button>
      <button class="small" data-preset="bak1">BAK 1 letters</button>
      <button class="small" data-preset="every">Every letter</button>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>First card</h3>
        <div class="sec-tools"><button class="small" data-all="0">All</button><button class="small" data-one="0">Clear</button></div></div>
      <div class="chips" id="chips0"></div>
    </div>
    <div class="sec">
      <div class="sec-head"><h3>Middle card (vowel)</h3>
        <div class="sec-tools"><button class="small" data-all="1">All</button><button class="small" data-one="1">Clear</button></div></div>
      <div class="chips v" id="chips1"></div>
    </div>
    <div class="sec">
      <div class="sec-head"><h3>Last card</h3>
        <div class="sec-tools"><button class="small" data-all="2">All</button><button class="small" data-one="2">Clear</button></div></div>
      <div class="chips" id="chips2"></div>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>Letter style</h3></div>
      <div class="fonts" id="fonts"></div>
    </div>

    <label class="check"><input type="checkbox" id="hideLast"> Practice with the last card face down (tap anywhere on the screen to flip it over)</label>
    <div class="sec">
      <div class="sec-head"><h3>Kind of words</h3></div>
      <div class="pick col" id="wordType"></div>
      <p id="wordNote" style="margin:0;font-size:.85rem"></p>
    </div>
    <label class="check"><input type="checkbox" id="softc"> Skip c or g before e or i (ce, ci, ge, gi)</label>
    <label class="check"><input type="checkbox" id="showArrow"> Show blending arrow under the cards</label>
  </div>
</div>

<script>
(function () {

  var REAL = {};

  var REALOK = {};

  });
  // Letter styles the teacher can choose from. The first is the original.

    { id: "urbanist", name: "Urbanist", w: 500, css: 'Urbanist, "Century Gothic", Andika, system-ui, sans-serif' },
    { id: "andika", name: "Andika", css: '"Lexend", Andika, "Century Gothic", "Comic Sans MS", system-ui, sans-serif' },
    { id: "fredoka", name: "Fredoka", css: 'Fredoka, Andika, system-ui, sans-serif' },
    { id: "quicksand", name: "Quicksand", css: 'Quicksand, Andika, system-ui, sans-serif' },
    { id: "comic", name: "Comic Neue", w: 700, css: '"Comic Neue", "Comic Sans MS", Andika, sans-serif' },
    { id: "patrick", name: "Patrick Hand", css: '"Patrick Hand", "Comic Sans MS", Andika, sans-serif' },
    { id: "schoolbell", name: "Schoolbell", css: 'Schoolbell, "Comic Sans MS", Andika, sans-serif' }
  ];
  function applyFont() {
    var f = FONTS.filter(function (x) { return x.id === state.font; })[0] || FONTS[0];
    state.font = f.id;

  }

  var state = {

    softc: true,
    wordType: "nonsense",
    hideLast: false,
    font: "teachers",
    fv: 3,
    arrow: true

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && Array.isArray(saved.pools) && saved.pools.length === 3) {
      if (Array.isArray(saved.pools[2]) && saved.pools[2].length > 1) saved.pools[2] = saved.pools[2].filter(function (l) { return l !== "w"; });
      var ok = saved.pools.every(function (p, i) {
        return Array.isArray(p) && p.length > 0 && p.every(function (l) { return OPTIONS[i].indexOf(l) >= 0; });
      });
      if (ok) state.pools = saved.pools;
      if (typeof saved.softc === "boolean") state.softc = saved.softc;
      if (saved.wordType === "nonsense" || saved.wordType === "real" || saved.wordType === "both") state.wordType = saved.wordType;

  var PICS = {};   // the parent copy has no picture clue cards
  var picUrl = function (l) { return PICS[l] ? "/_blob/" + PICS[l] : null; };
  // The pictures are cropped tight, so each has a different shape. Fitting each one to the card on its own
  // makes tall, narrow pictures (like u) look much bigger. Instead, draw them all at one shared scale.
  var DIMS = {}, picScale = 0;

    var ls = Object.keys(DIMS); if (ls.length < 5) return;

    picScale = Math.min(3 * 0.9 / ws[at], 4 * 0.9 / hs[at]);
    [0, 1, 2].forEach(function (p) { if (word[p]) paint(p); });
  }
  Object.keys(PICS).forEach(function (l) { // load ahead so flips are quick
    var im = new Image();
    im.onload = function () { DIMS[l] = { w: im.naturalWidth, h: im.naturalHeight }; setScale(); };
    im.src = picUrl(l);
  });
  function sizePic(img, l) {
    var d = DIMS[l];
    if (!d || !picScale) { img.style.width = ""; return; }
    var k = Math.min(picScale, 3 * 0.9 / d.w, 4 * 0.9 / d.h); // an extra-large picture shrinks to fit
    img.style.width = (d.w * k / 3 * 100).toFixed(2) + "%";
  }
  var showPic = [false, false, false];
  var faceDown = [false, false, false];   // a face-down card shows its back until it is tapped

  var word = ["", "", ""];
  var cards = Array.prototype.slice.call(document.querySelectorAll(".card"));

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function bad(w) {
    var s = w.join("");
    if (BLOCK.indexOf(s) >= 0) return true;
    if (state.wordType === "nonsense" && REAL[s] === true) return true;
    if (state.wordType === "real" && REALOK[s] !== true) return true;
    if (w[0] === "w" && w[1] === "a") return true;   // "wa" does not say short a (was, wand), so a never follows w
    if (state.softc && (w[0] === "c" || w[0] === "g") && (w[1] === "e" || w[1] === "i")) return true;

  }
  function shuffled(arr) {
    var a = arr.slice();

    }
    return a;
  }

  // Letters in use: a running game uses that student's set; otherwise the set chosen in settings.
  function customFor(key) { return key && typeof scores !== "undefined" && scores.sounds && scores.sounds[key] ? scores.sounds[key] : null; }
  function P() { return (game && game.pools) || customFor(soundKey) || state.pools; }
  function ed() {   // the letters being edited in settings; a student gets their own copy on the first change
    if (!soundKey) return state.pools;
    if (!scores.sounds[soundKey]) scores.sounds[soundKey] = state.pools.map(function (a) { return a.slice(); });
    return scores.sounds[soundKey];
  }
  function saveEd() { if (soundKey) saveScores(); else save(); }
  var soundKey = "";   // "" = everyone; otherwise "p|Name" (student) or "|Name" (group)
  function nextLetter(pos, used) {
    var choices = shuffled(P()[pos]);
    for (var i = 0; i < choices.length; i++) {
      if (choices[i] === word[pos]) continue;

  }
  function freshWord() {
    var prev = word.join("");
    for (var n = 0; n < 200; n++) {
      var w = [pick(P()[0]), pick(P()[1]), pick(P()[2])];
      if (!bad(w) && (w.join("") !== prev || n > 150)) return w;
    }
    return [P()[0][0], P()[1][0], P()[2][0]];
  }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function paint(pos) {
    var card = cards[pos], span = card.querySelector(".ltr"), img = card.querySelector(".pic");
    var back = faceDown[pos];
    var url = (!back && showPic[pos]) ? picUrl(word[pos]) : null;
    span.textContent = word[pos];
    card.classList.toggle("back", back);
    if (url) { img.src = url; img.alt = "Picture clue for " + word[pos]; sizePic(img, word[pos]); }
    img.hidden = !url; span.hidden = !!url || back;
    card.classList.toggle("showing-pic", !!url);
    var b = document.querySelector('[data-clue="' + pos + '"]');
    b.setAttribute("aria-pressed", url ? "true" : "false");
    b.setAttribute("aria-label", url ? "Show letter" : "Picture clue"); b.title = url ? "Show letter" : "Picture clue";
    b.disabled = back || !picUrl(word[pos]);
    var all = document.getElementById("allClues");
    var any = showPic.some(function (v, i) { return v && picUrl(word[i]); });
    all.setAttribute("aria-pressed", any ? "true" : "false");
    all.textContent = any ? "Show letters" : "Show picture clues";
  }
  function turn(pos, change, animate) {
    var card = cards[pos];
    if (!animate || reduce) { change(); paint(pos); return; }
    card.classList.add("turning");

      change(); paint(pos);

      card.classList.remove("turning");

  // A new letter always lands letter side up.
  function show(pos, letter, animate) {
    turn(pos, function () { word[pos] = letter; showPic[pos] = false; }, animate);
  }
  function setPic(pos, on, animate) {
    if (faceDown[pos] || (on && !picUrl(word[pos]))) return;

  }
  function newWord(animate) {
    var w = freshWord();
    if (!game && state.hideLast) faceDown[2] = true;   // practice option: the last card starts face down
    w.forEach(function (l, i) {
      if (animate) setTimeout(function () { show(i, l, true); }, i * 90); else show(i, l, false);

  }

  cards.forEach(function (c) {
    c.addEventListener("click", function () {
      var p = +c.dataset.pos;
      if (faceDown[p]) turn(p, function () { faceDown[p] = false; }, true);   // tap a face-down card to show it
      else if (!game) flip(p);
    });
  });
  document.getElementById("newWord").addEventListener("click", function () { newWord(true); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-clue]"), function (b) {
    b.addEventListener("click", function () { var p = +b.dataset.clue; setPic(p, !showPic[p], true); });
  });
  document.getElementById("allClues").addEventListener("click", function () {
    var any = showPic.some(function (v, i) { return v && picUrl(word[i]); });
    [0, 1, 2].forEach(function (p) { setTimeout(function () { setPic(p, !any, true); }, p * 90); });
  });
  document.addEventListener("keydown", function (e) {
    if (document.getElementById("scrim").classList.contains("open")) {
      if (e.key === "Escape") closeSet();
      return;
    }
    if (game || document.getElementById("gameScrim").classList.contains("open")) return;

    else if (e.key === " " && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); newWord(true); }
  });

  // ----- settings -----
  var scrim = document.getElementById("scrim");
  function buildChips() {
    for (var p = 0; p < 3; p++) {
      var box = document.getElementById("chips" + p);
      box.innerHTML = "";
      OPTIONS[p].forEach(function (l) {
        var b = document.createElement("button");
        b.className = "chip"; b.textContent = l; b.dataset.pos = p; b.dataset.l = l;
        b.setAttribute("aria-pressed", (customFor(soundKey) || state.pools)[p].indexOf(l) >= 0 ? "true" : "false");
        box.appendChild(b);
      });
    }
    buildWho();
    document.getElementById("softc").checked = state.softc;
    document.getElementById("wordType").innerHTML = [["nonsense", "Nonsense words"], ["real", "Real words"], ["both", "Both"]].map(function (o) {
      return '<button class="opt" data-wt="' + o[0] + '" aria-pressed="' + (state.wordType === o[0]) + '">' + o[1] + "</button>";
    }).join("");
    var wn = document.getElementById("wordNote");
    if (state.wordType === "real") wn.textContent = realFits() ? "Only real short-vowel words come up. Choose more letters if the same words repeat." : "No real word fits the letters chosen below. Add more letters.";
    else if (state.wordType === "nonsense") wn.textContent = "Real words are skipped.";
    else wn.textContent = "Real and nonsense words are mixed.";
    document.getElementById("hideLast").checked = state.hideLast;
    document.getElementById("fonts").innerHTML = FONTS.map(function (f) {
      return '<button class="fontpick" data-font="' + f.id + '" aria-pressed="' + (f.id === state.font) + '"><b style=\'font-weight:' + (f.w || 400) + ';font-family:' + f.css.replace(/"/g, "&quot;") + '\'>a g t y</b><span>' + f.name + "</span></button>";
    }).join("");

  }
  function order(p) {
    var a = ed(); a[p] = OPTIONS[p].filter(function (l) { return a[p].indexOf(l) >= 0; });
  }
  function nameOf(key) { return key.slice(key.indexOf("|") + 1); }
  function buildWho() {
    var names = scores.people.map(function (n) { return "p|" + n; }).concat(scores.groups.map(function (n) { return "|" + n; }));
    var box = document.getElementById("whoSounds");
    box.innerHTML = '<button class="opt" data-who="" aria-pressed="' + (soundKey === "") + '">Everyone</button>' + names.map(function (k) {
      return '<button class="opt" data-who="' + esc(k) + '" aria-pressed="' + (k === soundKey) + '">' + esc(nameOf(k)) + (scores.sounds[k] ? " &#10003;" : "") + "</button>";
    }).join("");
    var note = document.getElementById("whoNote");
    if (!names.length) note.textContent = "These letters are used for everyone. Add student names in Play 10 flips to give each student their own set.";
    else if (!soundKey) note.textContent = "Used for anyone without their own set. A check mark means that student has their own set.";
    else if (scores.sounds[soundKey]) note.innerHTML = esc(nameOf(soundKey)) + " has their own set. <button class=\"link\" style=\"padding:0;color:#2f4f9e\" data-resetwho=\"1\">Use everyone's set instead</button>";
    else note.textContent = nameOf(soundKey) + " is using everyone's set. Change a letter below to give " + nameOf(soundKey) + " their own.";
  }
  scrim.addEventListener("click", function (e) {
    var t = e.target;
    if (t === scrim) { closeSet(); return; }
    var wtb = t.closest ? t.closest("[data-wt]") : null;
    if (wtb) { state.wordType = wtb.dataset.wt; save(); buildChips(); return; }
    var wh = t.closest ? t.closest("[data-who]") : null;
    if (wh) { soundKey = wh.dataset.who; buildChips(); return; }
    if (t.dataset.resetwho) { delete scores.sounds[soundKey]; saveScores(); buildChips(); return; }
    var fp = t.closest ? t.closest("[data-font]") : null;
    if (fp) { state.font = fp.dataset.font; save(); applyFont(); buildChips(); return; }
    if (t.classList.contains("chip")) {
      var p = +t.dataset.pos, l = t.dataset.l, cur = customFor(soundKey) || state.pools, i = cur[p].indexOf(l);
      if (i >= 0) {
        if (cur[p].length === 1) return; // keep at least one
        ed()[p].splice(i, 1);
      } else { ed()[p].push(l); order(p); }

  }
  function finishGame() {
    var score = game.results.filter(Boolean).length, group = game.group, kind = game.kind;
    var rec = { g: group, d: today(), s: score, t: Date.now() };
    if (FLIPS !== 10) rec.n = FLIPS;
    if (game.hide) rec.m = "hide"; else if (game.chain) rec.m = "chain";
    if (kind === "p") rec.k = "p";
    scores.games.push(rec);
    saveScores();
    endGame();
    openSheet(function () {
      var todays = scores.games.filter(function (x) { return sameReader(x, group, kind) && x.d === today(); });
      gameSheet.innerHTML =
        '<h2 class="center">' + esc(group) + "</h2>" +
        '<p class="big">' + score + " out of " + FLIPS + "</p>" +
        (todays.length > 1 ? '<p class="center">Today so far: ' + todays.map(function (x) { return x.s; }).join(", ") + "</p>" : "") +
        whereSaved() +
        '<div class="foot"><button class="btn primary" data-act="again">Play again</button><button class="btn" data-act="scores">See scores</button><button class="btn" data-act="close">Done</button></div>';
    });
  }

  // --- scores by day ---
  var editNames = false, sureDel = "";
  function deleteReader(nm, kd) {
    scores.games = scores.games.filter(function (x) { return !sameReader(x, nm, kd); });
    var lst = listOf(kd), ix = lst.indexOf(nm); if (ix >= 0) lst.splice(ix, 1);
    delete scores.sounds[kd + "|" + nm]; if (soundKey === kd + "|" + nm) soundKey = "";
    if (scores.last === nm && (scores.lastKind || "") === kd) { scores.last = ""; scores.lastKind = ""; }
    if (chosen === nm && chosenKind === kd) { chosen = ""; chosenKind = ""; }
    if (kd === "p") taken = taken.filter(function (x) { return x !== nm; });
    saveScores();
  }
  var showGroup = "", showKind = "", sure = 0, sureName = "";
  function scoresView() {
    var lists = { "": scores.groups.slice(), p: scores.people.slice() };
    scores.games.forEach(function (x) { var l = lists[x.k || ""]; if (l.indexOf(x.g) < 0) l.push(x.g); });
    var any = lists[""].length + lists.p.length;
    if (lists[showKind].indexOf(showGroup) < 0) {
      if (lists[scores.lastKind || ""].indexOf(scores.last) >= 0) { showGroup = scores.last; showKind = scores.lastKind || ""; }
      else { showKind = lists[""].length ? "" : "p"; showGroup = lists[showKind][0] || ""; }
    }
    var mine = scores.games.filter(function (x) { return sameReader(x, showGroup, showKind); }).sort(function (a, b) { return b.t - a.t; });
    var days = [], byDay = {};
    mine.forEach(function (x) { if (!byDay[x.d]) { byDay[x.d] = []; days.push(x.d); } byDay[x.d].push(x); });
    gameSheet.innerHTML =
      '<div class="sheet-top"><h2>Scores</h2><button class="btn primary" data-act="close">Done</button></div>' +
      (any ? [["", "Groups"], ["p", "Students"]].map(function (kd) {
        var list = lists[kd[0]]; if (!list.length) return "";
        return '<p style="margin:10px 0 0">' + kd[1] + '</p><div class="pick" style="margin-top:4px">' + list.map(function (g) {
          return '<button class="small" data-show="' + esc(g) + '" data-kind="' + kd[0] + '" aria-pressed="' + (g === showGroup && kd[0] === showKind) + '">' + esc(g) + "</button>";
        }).join("") + "</div>";
      }).join("") : "<p>No scores yet. Press Play 10 flips to start a game.</p>") +
      (any && !days.length ? "<p>No games yet for " + esc(showGroup) + ".</p>" : "") +
      days.map(function (d) {
        return '<div class="day"><h4>' + esc(niceDate(d)) + "</h4>" + byDay[d].slice().reverse().map(function (x) {
          return '<div class="game"><span><b>' + x.s + "</b> out of " + (x.n || 10) + (x.m === "hide" ? " · last card hidden" : x.m === "chain" ? " · word chain" : "") + '</span><button class="small" data-remove="' + x.t + '">' + (sure === x.t ? "Tap again to remove" : "Remove") + "</button></div>";
        }).join("") + "</div>";
      }).join("") +
      (any && showGroup ? '<div style="margin-top:16px;text-align:center"><button class="small" style="color:#b3261e;border-color:#b3261e" data-delname="1">' + (sureName === showKind + "|" + showGroup ? "Tap again to delete " + esc(showGroup) + " and all scores" : "Delete " + esc(showGroup) + (showKind === "p" ? " (student)" : " (group)")) + "</button></div>" : "") +
      (any ? whereSaved() : "");
  }

  gameScrim.addEventListener("click", function (e) {
    var t = e.target;
    if (t === gameScrim) { if (!game) closeSheet(); return; }
    if (t.closest) t = t.closest("button") || t;
    if (t.dataset.lt || t.dataset.lp) {
      var k = chosenKind + "|" + chosen, cur = customFor(k) || state.pools;
      if (t.dataset.lp) { scores.sounds[k] = PRESETS[t.dataset.lp].map(function (a) { return a.slice(); }); saveScores(); }
      else {
        var pos = +t.dataset.lt.charAt(0), l = t.dataset.lt.slice(1), P3 = cur.map(function (a) { return a.slice(); }), arr = P3[pos], i = arr.indexOf(l);
        var wasSimple = sameSet(cur[2], cur[0].filter(function (x) { return x !== "w"; }));
        if (i >= 0) { if (arr.length === 1) return; arr.splice(i, 1); } else arr.push(l);
        if (wasSimple && pos === 0) {   // one consonant row drives both the first and last card
          if (!P3[0].filter(function (x) { return x !== "w"; }).length) return;
          setSimple(k, P3[0], P3[1]);
        } else {
          P3[pos] = OPTIONS[pos].filter(function (x) { return arr.indexOf(x) >= 0; }); scores.sounds[k] = P3; saveScores();
        }
      }
      startView(); return;
    }
    if (t.dataset.group) { chosen = t.dataset.group; chosenKind = t.dataset.kind || ""; startView(); }
    else if (t.dataset.mode) { gameMode = t.dataset.mode; startView(); }
    else if (t.dataset.show) { showGroup = t.dataset.show; showKind = t.dataset.kind || ""; sure = 0; sureName = ""; scoresView(); }
    else if (t.dataset.delname) {
      var key = showKind + "|" + showGroup;
      if (sureName !== key) { sureName = key; scoresView(); return; }
      deleteReader(showGroup, showKind);
      showGroup = ""; showKind = ""; sure = 0; sureName = "";
      scoresView();
    }
    else if (t.dataset.remove) {
      var id = +t.dataset.remove;
      if (sure !== id) { sure = id; scoresView(); return; }
      scores.games = scores.games.filter(function (x) { return x.t !== id; }); sure = 0; saveScores(); scoresView();
    }
    else if (t.dataset.del) {
      var dv = t.dataset.del, bar = dv.indexOf("|");
      if (sureDel !== dv) { sureDel = dv; startView(); return; }
      deleteReader(dv.slice(bar + 1), dv.slice(0, bar)); sureDel = ""; startView();
    }
    else if (t.dataset.act === "editnames") { editNames = !editNames; sureDel = ""; startView(); }
    else if (t.dataset.act === "close") { editNames = false; sureDel = ""; closeSheet(); }
    else if (t.dataset.act === "add") addGroup("");
    else if (t.dataset.act === "addp") addGroup("p");
    else if (t.dataset.act === "lettersToggle") { lettersOpen = !lettersOpen; startView(); }
    else if (t.dataset.act === "lettersreset") { delete scores.sounds[chosenKind + "|" + chosen]; saveScores(); startView(); }
    else if (t.dataset.act === "moreletters") { soundKey = chosenKind + "|" + chosen; editNames = false; closeSheet(); document.getElementById("openSet").click(); }
    else if (t.dataset.act === "start") startGame();
    else if (t.dataset.act === "again") { startGame(); }
    else if (t.dataset.act === "scores") { sure = 0; openSheet(scoresView); }
  });
  gameScrim.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "newGroup") { e.preventDefault(); addGroup("p"); }
    else if (e.key === "Escape" && (sheetView === startView || sheetView === scoresView)) closeSheet();
  });
  // Sharing code. Only shown when this copy of the app has a public address to share.
  var SHARE_URL = "https://heathmck-a11y.github.io/cvc-card-flipper/";
  var qrBox = document.getElementById("qrBox");
  if (SHARE_URL && qrBox.querySelector("svg")) {
    qrBox.hidden = false;
    qrBox.addEventListener("click", function () {
      if (game) return;
      openSheet(function () {
        gameSheet.innerHTML = '<div class="sheet-top"><h2>Share this app</h2><button class="btn primary" data-act="close">Done</button></div>' +
          "<p>Scan the code with a phone or tablet camera to open the CVC Card Flipper.</p>" +
          '<div id="qrBig">' + qrBox.innerHTML + "</div>" +
          '<p class="center" style="margin-top:12px;word-break:break-all"><b>' + esc(SHARE_URL.replace(/^https?:\/\//, "")) + "</b></p>";
      });
    });
  }
  if (!Object.keys(PICS).length) document.body.classList.add("nopics");
  document.getElementById("playBtn").addEventListener("click", function () { editNames = false; sureDel = ""; openSheet(startView); });
  document.getElementById("scoresBtn").addEventListener("click", function () { sure = 0; openSheet(scoresView); });
  document.getElementById("markYes").addEventListener("click", function () { mark(true); });
  document.getElementById("markNo").addEventListener("click", function () { mark(false); });
  document.getElementById("stopGame").addEventListener("click", endGame);

  applyArrow();
  applyFont();
  newWord(false);
})();
</script>
</body>
</html>
