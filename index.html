<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVC Card Flipper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400&text=y&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Teachers:wght@500&family=Urbanist:wght@500&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400&family=Patrick+Hand&family=Quicksand:wght@500&family=Schoolbell&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141a3c;
    --sheet: #fbf6ec;
    --card-edge: #8fa0ee;
    --ink: #1f2a44;
    --muted: #6b7280;
    --card: #ffffff;
    --edge: #d9cfbd;
    --vowel: #c8372d;
    --vowel-bg: #fff4e0;
    --accent: #ffd23f;
    --accent-ink: #1f2a44;
    --chip-on: #2f4f9e;
    --chip-on-vowel: #c8372d;
    --letters: Teachers, "Century Gothic", Andika, system-ui, sans-serif;
    --letters-w: 500;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--bg); color: var(--ink);
    background-image:
      radial-gradient(circle at 12% 18%, #fff 0 1.5px, transparent 2px),
      radial-gradient(circle at 78% 12%, #fff 0 2px, transparent 2.5px),
      radial-gradient(circle at 34% 62%, #cfd8ff 0 1.5px, transparent 2px),
      radial-gradient(circle at 91% 55%, #fff 0 1.5px, transparent 2px),
      radial-gradient(circle at 58% 34%, #ffe9a8 0 2px, transparent 2.5px),
      radial-gradient(circle at 22% 88%, #fff 0 2px, transparent 2.5px),
      radial-gradient(circle at 67% 82%, #cfd8ff 0 1.5px, transparent 2px),
      radial-gradient(circle at 46% 8%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 5% 48%, #ffe9a8 0 1.5px, transparent 2px),
      radial-gradient(circle at 110% 105%, #6b4fd8 0 16vmin, transparent 16.2vmin),
      radial-gradient(circle at -6% -8%, #2b8f8a 0 12vmin, transparent 12.2vmin),
      linear-gradient(180deg, #141a3c, #2a1f5c);
    background-attachment: fixed;
    font-family: "Lexend", Andika, "Century Gothic", "Comic Sans MS", system-ui, sans-serif;
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; gap: 12px;
  }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
  h1 svg { width: 42px; height: 42px; flex: none; }
  button { font: inherit; cursor: pointer; }
  .btn {
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 1rem;
    min-height: 46px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  #hideToggle[aria-pressed="true"] { background: rgba(255, 210, 63, .18); }
  .btn:focus-visible, .card:focus-visible, .chip:focus-visible { outline: 3px solid #f2a900; outline-offset: 3px; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 16px 20px; gap: 3vh; min-height: 0;
  }
  .row { display: flex; gap: clamp(8px, 2.5vw, 28px); justify-content: center; width: 100%; perspective: 1400px; }
  .card {
    width: min(29vw, 42vh); aspect-ratio: 3 / 4;
    background: var(--card); color: var(--ink); font-family: var(--letters);
    border: 3px solid var(--card-edge); border-radius: clamp(12px, 2.4vw, 28px);
    box-shadow: 0 6px 0 var(--card-edge), 0 0 34px rgba(143, 160, 238, .45);
    font-size: min(22vw, 32vh); line-height: 1; font-weight: var(--letters-w, 400);
    display: flex; align-items: center; justify-content: center;
    padding: 0 0 .12em; position: relative;
    transition: transform .16s ease-in;
    user-select: none; -webkit-user-select: none;
  }
  .card.vowel { background: var(--card); color: var(--ink); }
  .card.showing-pic { background: #fff; }
  .card.back {
    background-color: #2a2f7a; border-color: #ffd23f; box-shadow: 0 6px 0 #c79a12, 0 0 34px rgba(255, 210, 63, .4);
    background-image:
      radial-gradient(circle at 20% 22%, #fff 0 2px, transparent 3px), radial-gradient(circle at 78% 30%, #cfd8ff 0 2px, transparent 3px),
      radial-gradient(circle at 30% 80%, #fff 0 2px, transparent 3px), radial-gradient(circle at 72% 74%, #ffe9a8 0 2px, transparent 3px);
  }
  .card.back::after { content: "\2605"; color: #ffd23f; font-size: .6em; font-family: system-ui, sans-serif; }
  .card .pic { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: auto; height: auto; max-width: 90%; max-height: 90%; pointer-events: none; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  /* Picture clue controls are kept faint on purpose so they don't pull students' eyes. */
  .clue { width: 44px; height: 30px; background: none; border: none; padding: 0; display: flex; align-items: center; justify-content: center; }
  .clue::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .22); }
  .clue[aria-pressed="true"]::before { background: rgba(255, 210, 63, .75); }
  .link.faint { flex-basis: 100%; text-decoration: none; font-size: .8rem; opacity: .4; padding: 4px; }
  .clue:disabled { opacity: .35; }
  .card.turning { transform: rotateX(90deg); }
  .card.nope { animation: nope .3s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .card .hint {
    position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
    font-size: clamp(10px, 1.4vw, 14px); color: var(--muted); letter-spacing: .04em;
  }
  .arrow { width: min(92vw, 138vh); height: 40px; display: flex; align-items: center; padding-left: 5%; }
  .arrow .trail { flex: 1; height: 0; border-top: 5px dotted #ffd23f; opacity: .9; }
  .arrow svg { width: 64px; height: 40px; flex: none; display: block; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* settings */
  .scrim {
    position: fixed; inset: 0; background: rgba(31, 42, 68, .45);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .scrim.open { display: flex; }
  .sheet {
    background: var(--sheet); width: min(760px, 100%); max-height: 94vh; overflow: auto;
    border-radius: 22px 22px 0 0; padding: 18px 18px 24px;
    font-family: system-ui, sans-serif;
  }
  @media (min-height: 700px) and (min-width: 800px) {
    .scrim { align-items: center; } .sheet { border-radius: 22px; }
  }
  .sheet h2 { margin: 0; font-size: 1.2rem; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .sheet p { margin: 4px 0 10px; color: var(--muted); font-size: .92rem; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .small {
    border: 1.5px solid var(--edge); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 7px 14px; font-size: .9rem; min-height: 38px;
  }
  .sec { margin-top: 16px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sec-head h3 { margin: 0; font-size: 1rem; }
  .sec-head span { color: var(--muted); font-size: .85rem; }
  .sec-tools { display: flex; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .chip {
    width: 46px; height: 46px; border-radius: 12px;
    border: 2px solid var(--edge); background: #fff; color: var(--muted);
    font-family: var(--letters); font-size: 1.4rem; line-height: 1;
    padding: 0 0 3px;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }
  .chips.v .chip[aria-pressed="true"] { background: var(--chip-on-vowel); border-color: var(--chip-on-vowel); }
  .fonts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .fontpick { border: 2px solid var(--edge); background: #fff; color: var(--ink); border-radius: 12px; padding: 6px 12px 8px; text-align: center; min-width: 104px; }
  .fontpick b { display: block; font-weight: 400; font-size: 1.7rem; line-height: 1.25; }
  .fontpick span { display: block; font-family: system-ui, sans-serif; font-size: .75rem; color: var(--muted); }
  .fontpick[aria-pressed="true"] { border-color: #2f4f9e; box-shadow: 0 0 0 2px #2f4f9e; }
  .check { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: .95rem; }
  .check input { width: 22px; height: 22px; }
  .hud { color: #fff; text-align: center; font-family: system-ui, sans-serif; }
  .hud .who { font-size: 1.05rem; font-weight: 700; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #8fa0ee; background: transparent; }
  .dot.yes { background: #5fd36a; border-color: #5fd36a; }
  .dot.no { background: #ff7a6b; border-color: #ff7a6b; }
  .dot.now { border-color: #ffd23f; box-shadow: 0 0 0 3px rgba(255, 210, 63, .35); }
  .mark { border: none; border-radius: 18px; padding: 14px 26px; font-weight: 700; font-size: 1.15rem; min-height: 60px; min-width: 150px; color: #10231a; }
  .mark.yes { background: #5fd36a; }
  .mark.no { background: #ff9d8f; }
  .mark:disabled { opacity: .5; }
  .link { background: none; border: none; color: #cfd8ff; text-decoration: underline; font-size: .95rem; padding: 10px; font-family: system-ui, sans-serif; }
  .sheet .big { font-family: Andika, sans-serif; font-size: 3.2rem; font-weight: 700; text-align: center; margin: 10px 0 0; color: var(--ink); }
  .sheet .center { text-align: center; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .pick .small[aria-pressed="true"] { background: #2f4f9e; border-color: #2f4f9e; color: #fff; }
  .addrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
  .addrow input { flex: 1; min-width: 140px; font: inherit; padding: 9px 12px; border: 1.5px solid var(--edge); border-radius: 12px; background: #fff; color: var(--ink); }
  .day { background: #fff; border: 1.5px solid var(--edge); border-radius: 14px; padding: 10px 14px; margin-top: 8px; }
  .day h4 { margin: 0 0 4px; font-size: .95rem; }
  .game { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .game b { font-size: 1.1rem; }
  .sheet .foot { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .sheet .btn { border-color: #2f4f9e; color: #2f4f9e; }
  .sheet .btn.primary { background: #2f4f9e; color: #fff; }
  .sheet .btn:disabled { opacity: .45; }
  .nopics .clue, .nopics #allClues { display: none; }
  #qrBox { position: fixed; left: 10px; bottom: 10px; width: 54px; height: 54px; padding: 4px; background: #fff; border: none; border-radius: 8px; opacity: .85; z-index: 5; }
  #qrBox svg, #qrBig svg { width: 100%; height: 100%; display: block; }
  #qrBig { width: min(70vw, 60vh); height: min(70vw, 60vh); background: #fff; padding: 14px; border-radius: 16px; margin: 0 auto; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card.nope { animation: none; } }
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 48 48" aria-hidden="true">
    <line x1="16" y1="12" x2="12" y2="4" stroke="#7be36b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="12" x2="36" y2="4" stroke="#7be36b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="12" cy="4" r="3" fill="#ffd23f"/><circle cx="36" cy="4" r="3" fill="#ffd23f"/>
    <ellipse cx="24" cy="27" rx="18" ry="16" fill="#7be36b"/>
    <circle cx="17" cy="24" r="6" fill="#fff"/><circle cx="31" cy="24" r="6" fill="#fff"/>
    <circle cx="18" cy="25" r="2.6" fill="#1f2a44"/><circle cx="30" cy="25" r="2.6" fill="#1f2a44"/>
    <path d="M17 35 Q24 40 31 35" fill="none" stroke="#1f2a44" stroke-width="2.2" stroke-linecap="round"/>
  </svg>CVC Card Flipper</h1>
  <button class="btn" id="openSet">Choose letters</button>
</header>

<main>
  <div class="hud" id="hud" hidden>
    <div class="who" id="hudWho"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="row" id="row">
    <div class="col"><button class="card" data-pos="0" aria-label="First letter. Tap to flip."><span class="ltr"></span><img class="pic" alt="" hidden></button><button class="clue" data-clue="0" aria-pressed="false" aria-label="Picture clue" title="Picture clue"></button></div>
    <div class="col"><button class="card vowel" data-pos="1" aria-label="Middle letter. Tap to flip."><span class="ltr"></span><img class="pic" alt="" hidden></button><button class="clue" data-clue="1" aria-pressed="false" aria-label="Picture clue" title="Picture clue"></button></div>
    <div class="col"><button class="card" data-pos="2" aria-label="Last letter. Tap to flip."><span class="ltr"></span><img class="pic" alt="" hidden></button><button class="clue" data-clue="2" aria-pressed="false" aria-label="Picture clue" title="Picture clue"></button></div>
  </div>
  <div class="arrow" id="arrow" aria-hidden="true">
    <div class="trail"></div>
    <svg viewBox="0 0 64 40">
      <path d="M2 20 L14 13 L14 27 Z" fill="#ff8a3d"/>
      <path d="M12 10 L40 10 Q58 12 62 20 Q58 28 40 30 L12 30 Z" fill="#f4f6ff" stroke="#8fa0ee" stroke-width="2"/>
      <path d="M46 11 Q58 13 62 20 Q58 27 46 29 Z" fill="#ff5d5d"/>
      <circle cx="34" cy="20" r="5" fill="#6fd3ff" stroke="#1f2a44" stroke-width="2"/>
      <path d="M12 10 L6 3 L22 10 Z M12 30 L6 37 L22 30 Z" fill="#ff5d5d"/>
    </svg>
  </div>
  <div class="controls" id="freeControls">
    <button class="btn primary" id="newWord">New word</button>
    <button class="btn" id="hideToggle" aria-pressed="false">Last card: showing</button>
    <button class="btn" id="playBtn">Play 10 flips</button>
    <button class="btn" id="scoresBtn">Scores</button>
    <button class="link faint" id="allClues" aria-pressed="false">Show picture clues</button>
  </div>
  <div id="gameControls" hidden>
    <div class="controls">
      <button class="mark yes" id="markYes">Read it</button>
      <button class="mark no" id="markNo">Not yet</button>
    </div>
    <div class="controls"><button class="link" id="stopGame">Stop this game (score is not saved)</button></div>
  </div>
</main>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-top">
      <h2 id="setTitle">Choose letters</h2>
      <button class="btn primary" id="closeSet">Done</button>
    </div>
    <p>Tap letters to turn them on or off for each card. Each card needs at least one letter.</p>
    <div class="quick">
      <button class="small" data-preset="standard">Standard CVC</button>
      <button class="small" data-preset="bak1">BAK 1 letters</button>
      <button class="small" data-preset="every">Every letter</button>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>First card</h3>
        <div class="sec-tools"><button class="small" data-all="0">All</button><button class="small" data-one="0">Clear</button></div></div>
      <div class="chips" id="chips0"></div>
    </div>
    <div class="sec">
      <div class="sec-head"><h3>Middle card (vowel)</h3>
        <div class="sec-tools"><button class="small" data-all="1">All</button><button class="small" data-one="1">Clear</button></div></div>
      <div class="chips v" id="chips1"></div>
    </div>
    <div class="sec">
      <div class="sec-head"><h3>Last card</h3>
        <div class="sec-tools"><button class="small" data-all="2">All</button><button class="small" data-one="2">Clear</button></div></div>
      <div class="chips" id="chips2"></div>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>Letter style</h3></div>
      <div class="fonts" id="fonts"></div>
    </div>

    <label class="check"><input type="checkbox" id="hideLast"> Practice with the last card face down (tap the card to flip it over)</label>
    <label class="check"><input type="checkbox" id="nonsense"> Nonsense words only (skip real words)</label>
    <label class="check"><input type="checkbox" id="softc"> Skip c or g before e or i (ce, ci, ge, gi)</label>
    <label class="check"><input type="checkbox" id="showArrow"> Show blending arrow under the cards</label>
  </div>
</div>

<script>
(function () {
  var CONS = "bcdfghjklmnpqrstvwxyz".split("");
  var VOWELS = "aeiou".split("");
  var OPTIONS = [CONS, VOWELS, CONS];

  var PRESETS = {
    standard: [
      "bcdfghjklmnprstvwyz".split(""),
      VOWELS.slice(),
      "bdgmnptx".split("")
    ],
    bak1: [
      "bmsrtngphlcfd".split(""),
      ["a", "i"],
      "bmstngpd".split("")
    ],

    document.getElementById("hud").hidden = !on;
    document.getElementById("gameControls").hidden = !on;
    document.getElementById("freeControls").hidden = on;
  }
  function endGame() {
    game = null; setGameUi(false);
    if (faceDown[2]) { faceDown[2] = false; paint(2); }
  }
  function startGame() {
    if (!chosen) return;
    if (!gameMode) gameMode = "open";
    scores.last = chosen; scores.lastKind = chosenKind; scores.mode = gameMode; saveScores();
    game = { group: chosen, kind: chosenKind, results: [], used: [], hide: gameMode === "hide" };
    faceDown[2] = game.hide;
    closeSheet(); setGameUi(true); drawHud(); newWord(true);
  }
  function nextFlip() {
    // A whole new word after every mark. Try not to repeat a word within one game.
    game.used.push(word.join(""));
    var w = null;
    for (var n = 0; n < 300 && !w; n++) {
      var t = [pick(state.pools[0]), pick(state.pools[1]), pick(state.pools[2])];
      if (!bad(t) && game.used.indexOf(t.join("")) < 0) w = t;
    }
    if (!w) w = freshWord();
    if (game.hide) faceDown[2] = true;   // the last card goes face down again for every word
    w.forEach(function (l, i) { setTimeout(function () { show(i, l, true); }, i * 90); });
  }
  function mark(ok) {
    if (!game || game.results.length >= FLIPS) return;
    game.results.push(ok); drawHud();
    var btns = [document.getElementById("markYes"), document.getElementById("markNo")];
    btns.forEach(function (b) { b.disabled = true; });
    setTimeout(function () { btns.forEach(function (b) { b.disabled = false; }); }, 450);
    if (game.results.length >= FLIPS) finishGame(); else nextFlip();
  }
  function finishGame() {
    var score = game.results.filter(Boolean).length, group = game.group, kind = game.kind;
    var rec = { g: group, d: today(), s: score, t: Date.now() };
    if (game.hide) rec.m = "hide";
    if (kind === "p") rec.k = "p";
    scores.games.push(rec);
    saveScores();
    endGame();
    openSheet(function () {
      var todays = scores.games.filter(function (x) { return sameReader(x, group, kind) && x.d === today(); });
      gameSheet.innerHTML =
        '<h2 class="center">' + esc(group) + "</h2>" +
        '<p class="big">' + score + " out of " + FLIPS + "</p>" +
        (todays.length > 1 ? '<p class="center">Today so far: ' + todays.map(function (x) { return x.s; }).join(", ") + "</p>" : "") +
        whereSaved() +
        '<div class="foot"><button class="btn primary" data-act="again">Play again</button><button class="btn" data-act="scores">See scores</button><button class="btn" data-act="close">Done</button></div>';
    });
  }

  // --- scores by day ---
  var showGroup = "", showKind = "", sure = 0;
  function scoresView() {
    var lists = { "": scores.groups.slice(), p: scores.people.slice() };
    scores.games.forEach(function (x) { var l = lists[x.k || ""]; if (l.indexOf(x.g) < 0) l.push(x.g); });
    var any = lists[""].length + lists.p.length;
    if (lists[showKind].indexOf(showGroup) < 0) {
      if (lists[scores.lastKind || ""].indexOf(scores.last) >= 0) { showGroup = scores.last; showKind = scores.lastKind || ""; }
      else { showKind = lists[""].length ? "" : "p"; showGroup = lists[showKind][0] || ""; }
    }
    var mine = scores.games.filter(function (x) { return sameReader(x, showGroup, showKind); }).sort(function (a, b) { return b.t - a.t; });
    var days = [], byDay = {};
    mine.forEach(function (x) { if (!byDay[x.d]) { byDay[x.d] = []; days.push(x.d); } byDay[x.d].push(x); });
    gameSheet.innerHTML =
      '<div class="sheet-top"><h2>Scores</h2><button class="btn primary" data-act="close">Done</button></div>' +
      (any ? [["", "Groups"], ["p", "Students"]].map(function (kd) {
        var list = lists[kd[0]]; if (!list.length) return "";
        return '<p style="margin:10px 0 0">' + kd[1] + '</p><div class="pick" style="margin-top:4px">' + list.map(function (g) {
          return '<button class="small" data-show="' + esc(g) + '" data-kind="' + kd[0] + '" aria-pressed="' + (g === showGroup && kd[0] === showKind) + '">' + esc(g) + "</button>";
        }).join("") + "</div>";
      }).join("") : "<p>No scores yet. Press Play 10 flips to start a game.</p>") +
      (any && !days.length ? "<p>No games yet for " + esc(showGroup) + ".</p>" : "") +
      days.map(function (d) {
        return '<div class="day"><h4>' + esc(niceDate(d)) + "</h4>" + byDay[d].slice().reverse().map(function (x) {
          return '<div class="game"><span><b>' + x.s + "</b> out of " + FLIPS + (x.m === "hide" ? " · last card hidden" : "") + '</span><button class="small" data-remove="' + x.t + '">' + (sure === x.t ? "Tap again to remove" : "Remove") + "</button></div>";
        }).join("") + "</div>";
      }).join("") +
      (any ? whereSaved() : "");
  }

  gameScrim.addEventListener("click", function (e) {
    var t = e.target;
    if (t === gameScrim) { if (!game) closeSheet(); return; }
    if (t.dataset.group) { chosen = t.dataset.group; chosenKind = t.dataset.kind || ""; startView(); }
    else if (t.dataset.mode) { gameMode = t.dataset.mode; startView(); }
    else if (t.dataset.show) { showGroup = t.dataset.show; showKind = t.dataset.kind || ""; sure = 0; scoresView(); }
    else if (t.dataset.remove) {
      var id = +t.dataset.remove;
      if (sure !== id) { sure = id; scoresView(); return; }
      scores.games = scores.games.filter(function (x) { return x.t !== id; }); sure = 0; saveScores(); scoresView();
    }
    else if (t.dataset.act === "close") closeSheet();
    else if (t.dataset.act === "add") addGroup("");
    else if (t.dataset.act === "addp") addGroup("p");
    else if (t.dataset.act === "start") startGame();
    else if (t.dataset.act === "again") { startGame(); }
    else if (t.dataset.act === "scores") { sure = 0; openSheet(scoresView); }
  });
  gameScrim.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "newGroup") { e.preventDefault(); addGroup(""); }
    else if (e.key === "Escape" && (sheetView === startView || sheetView === scoresView)) closeSheet();
  });
  // Sharing code. Only shown when this copy of the app has a public address to share.
  var SHARE_URL = "https://heathmck-a11y.github.io/cvc-card-flipper/";
  var qrBox = document.getElementById("qrBox");
  if (SHARE_URL && qrBox.querySelector("svg")) {
    qrBox.hidden = false;
    qrBox.addEventListener("click", function () {
      if (game) return;
      openSheet(function () {
        gameSheet.innerHTML = '<div class="sheet-top"><h2>Share this app</h2><button class="btn primary" data-act="close">Done</button></div>' +
          "<p>Scan the code with a phone or tablet camera to open the CVC Card Flipper.</p>" +
          '<div id="qrBig">' + qrBox.innerHTML + "</div>" +
          '<p class="center" style="margin-top:12px;word-break:break-all"><b>' + esc(SHARE_URL.replace(/^https?:\/\//, "")) + "</b></p>";
      });
    });
  }
  if (!Object.keys(PICS).length) document.body.classList.add("nopics");
  document.getElementById("playBtn").addEventListener("click", function () { openSheet(startView); });
  document.getElementById("scoresBtn").addEventListener("click", function () { sure = 0; openSheet(scoresView); });
  document.getElementById("markYes").addEventListener("click", function () { mark(true); });
  document.getElementById("markNo").addEventListener("click", function () { mark(false); });
  document.getElementById("stopGame").addEventListener("click", endGame);

  applyArrow();
  applyFont();
  document.getElementById("hideToggle").setAttribute("aria-pressed", state.hideLast ? "true" : "false");
  document.getElementById("hideToggle").textContent = state.hideLast ? "Last card: hidden" : "Last card: showing";
  newWord(false);
})();
</script>
</body>
</html>
